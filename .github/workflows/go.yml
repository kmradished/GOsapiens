name: Go CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Race detector
        run: go test -race -count=1 ./...

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: gosapiens
          POSTGRES_PASSWORD: gosapiens
          POSTGRES_DB: gosapiens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gosapiens -d gosapiens"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gosapiens:gosapiens@127.0.0.1:5432/gosapiens?sslmode=disable
      CGO_ENABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: PostgreSQL tests
        run: go test -race -tags=dbintegration -count=1 ./internal/postgres -v
